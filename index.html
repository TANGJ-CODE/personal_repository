<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>登录</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 24px;
			background: #f3f5f9;
			color: #202938;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
		}
		.login-card {
			width: min(100%, 400px);
			padding: 40px;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 12px 40px rgba(30, 45, 70, .09);
		}
		h1 { margin: 0 0 8px; font-size: 28px; }
		.subtitle { margin: 0 0 30px; color: #748094; font-size: 14px; }
		.field { margin-bottom: 20px; }
		label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
		input {
			width: 100%;
			height: 46px;
			padding: 0 13px;
			border: 1px solid #dce2eb;
			border-radius: 8px;
			outline: none;
			font: inherit;
			transition: border-color .2s, box-shadow .2s;
		}
		input:focus { border-color: #4f70e8; box-shadow: 0 0 0 3px rgba(79, 112, 232, .14); }
		.options { display: flex; justify-content: space-between; align-items: center; margin: 2px 0 24px; font-size: 13px; }
		.remember { display: flex; align-items: center; gap: 7px; color: #596579; }
		.remember input { width: 15px; height: 15px; margin: 0; }
		a { color: #4f70e8; text-decoration: none; }
		a:hover { text-decoration: underline; }
		button {
			width: 100%;
			height: 48px;
			border: 0;
			border-radius: 8px;
			background: #4f70e8;
			color: #fff;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #3e5fd4; }
		.signup { margin: 22px 0 0; color: #748094; text-align: center; font-size: 14px; }
		@media (max-width: 480px) { .login-card { padding: 32px 24px; } }
	</style>
</head>
<body>
	<main class="login-card">
		<h1>欢迎回来</h1>
		<p class="subtitle">登录以继续使用您的账户</p>
		<form action="#" method="post">
			<div class="field">
				<label for="email">邮箱</label>
				<input id="email" name="email" type="email" placeholder="请输入邮箱地址" autocomplete="email" required>
			</div>
			<div class="field">
				<label for="password">密码</label>
				<input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
			</div>
			<div class="options">
				<label class="remember"><input type="checkbox" name="remember"> 记住我</label>
				<a href="#">忘记密码？</a>
			</div>
			<button type="submit">登录</button>
			<button type="submit">取消</button>
            <h1>登录成功</h1>
		</form>
		<p class="signup">还没有账户？ <a href="#">立即注册</a></p>
	</main>
</body>
</html>
